[project]
name = "hr-sync-lab"
version = "0.1.0"
description = "Two mock HR systems, a sync engine, a reconciliation report and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "mcp>=2,<3"]

[project.scripts]
hrsync = "hrsync.cli:main"
hrsync-mcp = "mcp_server.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hris", "ethena", "hrsync", "reconcile", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
